<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiki 宝库</title>
<meta name="description" content="Kiki 的外观、装饰和宝，点一下在 Kiki 里装上。">
<style>
  :root {
    --bg: #f5f5f3; --card: #fff; --text: #1d1d1b; --muted: #6f6e69; --line: rgba(0,0,0,.09);
    --accent: #5b6cf0; --on-accent: #fff; --fill: rgba(0,0,0,.05); --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --card: #2a2a2d; --text: #f2f2f0; --muted: #a1a09b; --line: rgba(255,255,255,.1); --accent: #7d8bf6; --fill: rgba(255,255,255,.07); --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 64px; }
  header { padding: 48px 0 24px; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: .01em; }
  header p { margin: 6px 0 0; color: var(--muted); }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { font: inherit; font-size: 14px; min-height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .tabs button.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .bar input { flex: 1; min-width: 180px; font: inherit; font-size: 14px; min-height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--text); outline: none; }
  .bar input:focus { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .item { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .pic { aspect-ratio: 192 / 124; background: var(--fill) center / cover no-repeat; display: grid; place-items: center; font-size: 38px; border-bottom: 1px solid var(--line); }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .body b { font-size: 16px; }
  .by { font-size: 12.5px; color: var(--muted); }
  .desc { font-size: 13.5px; color: var(--muted); flex: 1; margin-top: 2px; }
  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; font-size: 12.5px; }
  .open { display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; border-radius: 8px; background: var(--accent); color: var(--on-accent) !important; font-size: 13.5px; font-weight: 500; text-decoration: none !important; }
  .acts a { white-space: nowrap; }
  .acts .src { margin-left: auto; }
  .empty { color: var(--muted); padding: 24px 0; }
  .help { margin-top: 40px; padding: 18px 20px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .help b { color: var(--text); }
  .help p { margin: 6px 0 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kiki 宝库</h1>
    <p>大家做的外观、装饰和宝。点「在 Kiki 里打开」，回到 Kiki 确认一下就装上。</p>
  </header>
  <div class="bar">
    <div class="tabs" role="tablist" aria-label="分类">
      <button type="button" data-kind="all" class="on">全部</button>
      <button type="button" data-kind="theme">外观</button>
      <button type="button" data-kind="decor">装饰</button>
      <button type="button" data-kind="bao">宝</button>
    </div>
    <input type="search" id="q" placeholder="搜名字、作者、介绍" aria-label="搜索">
  </div>
  <div id="list" class="empty">读取中…</div>
  <div class="help">
    <b>点了没反应？</b>
    <p>要先在这台电脑上装好 <a href="https://github.com/lkyxuan/kiki/releases/latest">Kiki</a> 并打开过一次。也可以点「复制链接」，在 Kiki 的「导入一个宝」里粘贴（宝）。</p>
    <b style="display:block;margin-top:14px">想上架自己做的？</b>
    <p>给 <a href="https://github.com/lkyxuan/kiki-store">kiki-store</a> 提一个 PR，在 store.json 里加一条，审核通过就会出现在这里。写法见仓库 README。</p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = (p) => p.split("/").map(encodeURIComponent).join("/");
let items = [], kind = "all";
// 外观和装饰都是 type: "theme"（装法一样），装饰多一个 kind: "decor"；分类按这个算
const cat = (x) => (x.type === "theme" && x.kind === "decor" ? "decor" : x.type);
const label = { theme: "外观", decor: "装饰", bao: "宝" };

function link(x) {
  const q = new URLSearchParams({ type: x.type, repo: x.repo, ref: x.ref });
  if (x.path) q.set("path", x.path);
  if (x.type === "theme") q.set("id", x.id);
  return "kiki://install?" + q.toString();
}
const tree = (x) => `https://github.com/${x.repo}/tree/${x.ref}${x.path ? "/" + enc(x.path) : ""}`;
const raw = (x, f) => `https://raw.githubusercontent.com/${x.repo}/${x.ref}/${enc(x.path ? x.path + "/" + f : f)}`;

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const list = items.filter((x) => (kind === "all" || cat(x) === kind) && (!q || [x.name, x.author, x.description].join(" ").toLowerCase().includes(q)));
  const box = $("#list");
  if (!list.length) { box.className = "empty"; box.textContent = items.length ? "没找到" : "宝库里还没有东西"; return; }
  box.className = "grid";
  box.innerHTML = list.map((x, i) => {
    const pic = x.preview ? ` style="background-image:url('${esc(raw(x, x.preview))}')"` : "";
    const icon = x.preview ? "" : x.type === "theme" ? "🎨" : "🤖";
    return `<div class="item"><div class="pic"${pic}>${icon}</div><div class="body">
      <b>${esc(x.name)}</b><span class="by">${label[cat(x)]}${x.author ? " · " + esc(x.author) : ""}</span>
      <span class="desc">${esc(x.description)}</span>
      <div class="acts"><a class="open" href="${esc(link(x))}">在 Kiki 里打开</a>${x.type === "bao" ? `<a href="#" data-copy="${i}">复制链接</a>` : ""}<a class="src" href="${esc(tree(x))}" target="_blank" rel="noopener">源码 ↗</a></div>
    </div></div>`;
  }).join("");
  box.querySelectorAll("[data-copy]").forEach((a) => a.onclick = (e) => {
    e.preventDefault();
    const x = list[+a.dataset.copy];
    navigator.clipboard?.writeText(tree(x)).then(() => toast("已复制"), () => toast("复制不了，长按「源码」复制"));
  });
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1600); }

$(".tabs").onclick = (e) => {
  const b = e.target.closest("[data-kind]"); if (!b) return;
  kind = b.dataset.kind;
  document.querySelectorAll(".tabs button").forEach((t) => t.classList.toggle("on", t === b));
  render();
};
$("#q").oninput = render;

fetch("store.json", { cache: "no-cache" }).then((r) => r.json()).then((j) => {
  // 和 Kiki 里的校验一致：锁 commit、仓库名合规；写错的条目跳过
  items = (j.items || []).filter((x) => x && (x.type === "theme" || x.type === "bao") && x.id && /^[\w.-]+\/[\w.-]+$/.test(x.repo || "") && /^[0-9a-f]{40}$/.test(x.ref || "") && !(x.path || "").split("/").some((p) => p === ".." || p.startsWith(".")));
  render();
}).catch(() => { $("#list").textContent = "读不到宝库清单，刷新一下试试"; });
</script>
</body>
</html>
